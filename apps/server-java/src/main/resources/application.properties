spring.main.banner-mode=off
server.port=${PORT:8787}
server.address=${KIT_BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.async.request-timeout=0
spring.servlet.multipart.max-file-size=${KIT_UPLOAD_MAX_BYTES:20971520}B
spring.servlet.multipart.max-request-size=${KIT_MULTIPART_MAX_BYTES:20975616}B
spring.servlet.multipart.resolve-lazily=true
