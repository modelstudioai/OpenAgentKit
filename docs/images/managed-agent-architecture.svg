    <rect x="1100" y="25" width="145" height="39" />
    <text class="label" x="1172.5" y="51">已实现</text>
  </g>
  <g class="planned center">
    <rect x="1258" y="25" width="145" height="39" />
    <text class="label" x="1330.5" y="51">未来规划</text>
  </g>
  <g class="excluded center">
    <rect x="1416" y="25" width="155" height="39" />
    <text class="label" x="1493.5" y="51">当前不实现</text>
  </g>

  <rect class="panel" x="24" y="96" width="1552" height="93" />
