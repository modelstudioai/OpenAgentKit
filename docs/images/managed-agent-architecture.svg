<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1056" role="img" aria-labelledby="title subtitle">
  <title id="title">OpenAgentKit 核心功能架构</title>
  <desc id="subtitle">围绕 Agent 配置、发布与使用建立核心主链路，按需扩展运营与质量能力</desc>
  <style>
    text {
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      fill: #17314a;
      font-size: 16px;
    }
    .title { font-size: 30px; font-weight: 700; }
    .section { font-size: 23px; font-weight: 700; }
    .subsection, .label { font-size: 18px; font-weight: 700; }
    .detail { font-size: 12.5px; }
    .muted { fill: #546579; }
    .center { text-anchor: middle; }
    .panel { fill: #fff; stroke: #61738b; stroke-width: 1.4; }
    .header { fill: #f5f7f9; stroke: #61738b; stroke-width: 1.4; }
    .ready rect { fill: #e6f4ec; stroke: #24804b; }
    .ready text { fill: #175537; }
    .planned rect { fill: #e9f0fc; stroke: #3776cb; }
    .planned text { fill: #224f85; }
    .excluded rect { fill: #fbeaeb; stroke: #b9383d; }
    .excluded text { fill: #852529; }
  </style>

  <rect width="1600" height="1056" fill="#fff" />
  <rect class="panel" x="12" y="12" width="1576" height="1032" />
  <rect class="header" x="12" y="12" width="1576" height="72" />
  <text class="title" x="30" y="46">OpenAgentKit 核心功能架构</text>
  <text class="muted" x="30" y="69">围绕 Agent 配置、发布与使用建立核心主链路，按需扩展运营与质量能力</text>
